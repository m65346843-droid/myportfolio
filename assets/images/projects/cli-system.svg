  <text x="65" y="222" fill="#e4e4e7" font-family="Courier, monospace" font-size="10">1. [HIGH] Compile kernel module benchmark [RUNNING 94%]</text>
  <text x="65" y="242" fill="#e4e4e7" font-family="Courier, monospace" font-size="10">2. [MED]  Backup SQL dump to /var/archive [QUEUED]</text>
  <text x="65" y="262" fill="#e4e4e7" font-family="Courier, monospace" font-size="10">3. [LOW]  Sync Git branches to origin    [DONE ✔]</text>

  <text x="65" y="295" fill="#10b981" font-family="Courier, monospace" font-size="11">user@devbox:~/projects/c-task$ <tspan fill="#38bdf8">█</tspan></text>

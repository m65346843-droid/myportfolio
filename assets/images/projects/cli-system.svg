<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgP5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgP5)"/>

  <!-- Terminal Shell -->
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="520" height="36" rx="12" fill="#18181b"/>
  <circle cx="64" cy="48" r="5" fill="#ef4444"/>
  <circle cx="82" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="48" r="5" fill="#10b981"/>
  <text x="125" y="52" fill="#a1a1aa" font-family="Courier, monospace" font-size="11" font-weight="bold">terminal ~ c-taskmaster [gcc -Wall -O2]</text>

  <rect x="435" y="40" width="110" height="18" rx="9" fill="#52525b"/>
  <text x="490" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">C UTILITY</text>

  <!-- Terminal lines -->
  <text x="65" y="95" fill="#10b981" font-family="Courier, monospace" font-size="11">user@devbox:~/projects/c-task$ <tspan fill="#fafafa">./taskmaster --daemon</tspan></text>
  <text x="65" y="120" fill="#38bdf8" font-family="Courier, monospace" font-size="10">[INIT] TaskMaster CLI daemon initialized (PID: 4092)</text>
  <text x="65" y="140" fill="#a1a1aa" font-family="Courier, monospace" font-size="10">[MEM]  Dynamic heap pool allocated: 1024 KB linked-list buffer</text>
  <text x="65" y="160" fill="#a1a1aa" font-family="Courier, monospace" font-size="10">[I/O]  Synchronized with state file: ~/.taskmaster/store.dat</text>
  
  <rect x="65" y="175" width="470" height="1" fill="#27272a"/>
  

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgP2)"/>
  
  <!-- Network Monitor Shell -->
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#0b131e" stroke="#059669" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Terminal Header -->
  <rect x="40" y="30" width="520" height="36" rx="12" fill="#06121e"/>
  <circle cx="64" cy="48" r="5" fill="#ef4444"/>
  <circle cx="82" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="48" r="5" fill="#10b981"/>
  <text x="125" y="52" fill="#10b981" font-family="Courier, monospace" font-size="11" font-weight="bold">wire-sniffer [LIVE CAPTURE: eth0] — Python / Wireshark</text>
  
  <!-- Packet table header -->
  <rect x="55" y="80" width="490" height="24" fill="#112233"/>
  <text x="65" y="96" fill="#38bdf8" font-family="Courier, monospace" font-size="10">NO.    TIME       SOURCE          DESTINATION      PROTO   LEN   INFO</text>
  
  <!-- Packet rows -->
  <rect x="55" y="108" width="490" height="20" fill="#0d1b2a"/>
  <text x="65" y="122" fill="#34d399" font-family="Courier, monospace" font-size="9">001    0.000000   192.168.1.105   142.250.190.46   TCP     74    44332 → 443 [SYN] Seq=0</text>
  
  <rect x="55" y="132" width="490" height="20" fill="#0b1522"/>
  <text x="65" y="146" fill="#38bdf8" font-family="Courier, monospace" font-size="9">002    0.012431   142.250.190.46  192.168.1.105    TCP     74    443 → 44332 [SYN, ACK] Seq=0</text>
  
  <rect x="55" y="156" width="490" height="20" fill="#0d1b2a"/>
  <text x="65" y="170" fill="#a7f3d0" font-family="Courier, monospace" font-size="9">003    0.012502   192.168.1.105   142.250.190.46   TLSv1.3 517   Client Hello (SNI)</text>
  
  <rect x="55" y="180" width="490" height="20" fill="#132738"/>
  <text x="65" y="194" fill="#fbbf24" font-family="Courier, monospace" font-size="9">004    0.034190   192.168.1.1     224.0.0.251      MDNS    92    Standard query response</text>
  
  <!-- Packet stream graph / oscilloscope wave -->
  <rect x="55" y="215" width="490" height="95" rx="6" fill="#06121e" stroke="#10b981" stroke-width="0.8"/>
  <text x="70" y="235" fill="#6ee7b7" font-family="Courier, monospace" font-size="10">TRAFFIC BANDWIDTH &amp; PROTOCOL DISTRIBUTION</text>
  
  <!-- Wave path -->
  <path d="M 65 290 Q 110 240, 150 270 T 230 250 T 320 280 T 400 230 T 480 260 T 535 285" fill="none" stroke="url(#greenGlow)" stroke-width="2.5"/>
  <circle cx="400" cy="230" r="4" fill="#38bdf8"/>
  <text x="410" y="230" fill="#38bdf8" font-family="Courier, monospace" font-size="9">PEAK: 12.4 MB/s</text>

  <!-- Tag badge -->
  <rect x="420" y="40" width="125" height="18" rx="9" fill="#059669"/>
  <text x="482" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">CYBERSECURITY</text>
</svg>

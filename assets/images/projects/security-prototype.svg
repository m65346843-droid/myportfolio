<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgP6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgP6)"/>

  <!-- Main Box -->
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#0c121e" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="520" height="36" rx="12" fill="#080c14"/>
  <circle cx="64" cy="48" r="5" fill="#ef4444"/>
  <circle cx="82" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="48" r="5" fill="#10b981"/>
  <text x="125" y="52" fill="#34d399" font-family="Courier, monospace" font-size="11" font-weight="bold">SecureAuth Lab — SHA-256 / Bcrypt / CSRF Protection</text>

  <rect x="425" y="40" width="120" height="18" rx="9" fill="#047857"/>
  <text x="485" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">CYBERSECURITY</text>

  <!-- Left: Shield emblem -->
  <g transform="translate(100, 100)">
    <circle cx="50" cy="60" r="55" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M50 25 L80 40 L80 75 Q50 105 50 105 Q20 75 20 40 Z" fill="url(#shieldGrad)" opacity="0.9"/>
    <!-- Keyhole -->
    <circle cx="50" cy="58" r="7" fill="#0f172a"/>
    <path d="M47 62 L53 62 L55 76 L45 76 Z" fill="#0f172a"/>
  </g>

  <!-- Right: Security Checklist & Status -->
  <rect x="230" y="85" width="310" height="225" rx="8" fill="#111c2e" stroke="#1e293b"/>
  <text x="250" y="112" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">SECURITY AUDIT METRICS</text>

  <rect x="250" y="128" width="270" height="24" rx="4" fill="#0c1422"/>
  <text x="260" y="144" fill="#34d399" font-family="Courier, monospace" font-size="10">✔ Salted Bcrypt Hash (Cost: 12)</text>

  <rect x="250" y="160" width="270" height="24" rx="4" fill="#0c1422"/>
  <text x="260" y="176" fill="#34d399" font-family="Courier, monospace" font-size="10">✔ SQL Injection Parameterization</text>

  <rect x="250" y="192" width="270" height="24" rx="4" fill="#0c1422"/>
  <text x="260" y="208" fill="#34d399" font-family="Courier, monospace" font-size="10">✔ SameSite HttpOnly Cookie Tokens</text>

  <rect x="250" y="224" width="270" height="24" rx="4" fill="#0c1422"/>
  <text x="260" y="240" fill="#34d399" font-family="Courier, monospace" font-size="10">✔ Rate Limiting (Token Bucket)</text>

  <rect x="250" y="260" width="130" height="34" rx="6" fill="#10b981"/>
  <text x="315" y="281" fill="#042f2e" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">PASSED ALL CHECKS</text>
</svg>

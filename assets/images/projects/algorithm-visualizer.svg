<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bgP3)"/>

  <!-- Code / Algorithm Canvas -->
  <rect x="40" y="30" width="520" height="300" rx="12" fill="#0b0f19" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Header -->
  <rect x="40" y="30" width="520" height="36" rx="12" fill="#080c14"/>
  <circle cx="64" cy="48" r="5" fill="#ef4444"/>
  <circle cx="82" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="48" r="5" fill="#10b981"/>
  <text x="125" y="52" fill="#c084fc" font-family="Courier, monospace" font-size="11" font-weight="bold">QuickSort &amp; Binary Tree Visualizer — C++ / STL</text>

  <!-- Tag badge -->
  <rect x="430" y="40" width="115" height="18" rx="9" fill="#7c3aed"/>
  <text x="487" y="53" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">PROGRAMMING</text>

  <!-- Sorting Bar Chart Area -->
  <rect x="60" y="85" width="280" height="150" rx="8" fill="#111827"/>
  <text x="75" y="105" fill="#94a3b8" font-family="Courier, monospace" font-size="9">O(n log n) QuickSort Pivot State</text>
  
  <!-- Bars -->
  <rect x="75" y="190" width="12" height="35" rx="3" fill="url(#barGrad)"/>
  <rect x="93" y="165" width="12" height="60" rx="3" fill="url(#barGrad)"/>
  <rect x="111" y="140" width="12" height="85" rx="3" fill="url(#barGrad)"/>
  <rect x="129" y="120" width="12" height="105" rx="3" fill="url(#activeGrad)"/> <!-- Pivot -->
  <rect x="147" y="175" width="12" height="50" rx="3" fill="url(#barGrad)"/>
  <rect x="165" y="130" width="12" height="95" rx="3" fill="url(#barGrad)"/>
  <rect x="183" y="150" width="12" height="75" rx="3" fill="url(#barGrad)"/>
  <rect x="201" y="115" width="12" height="110" rx="3" fill="url(#activeGrad)"/>
  <rect x="219" y="180" width="12" height="45" rx="3" fill="url(#barGrad)"/>
  <rect x="237" y="145" width="12" height="80" rx="3" fill="url(#barGrad)"/>
  <rect x="255" y="160" width="12" height="65" rx="3" fill="url(#barGrad)"/>
  <rect x="273" y="135" width="12" height="90" rx="3" fill="url(#barGrad)"/>
  <rect x="291" y="170" width="12" height="55" rx="3" fill="url(#barGrad)"/>
  <rect x="309" y="125" width="12" height="100" rx="3" fill="url(#barGrad)"/>

  <!-- Binary Search Tree graph on right side -->
  <rect x="360" y="85" width="180" height="150" rx="8" fill="#111827"/>
  <text x="375" y="105" fill="#94a3b8" font-family="Courier, monospace" font-size="9">BST Rebalance (AVL)</text>
  <!-- Tree nodes & edges -->
  <line x1="450" y1="125" x2="410" y2="160" stroke="#818cf8" stroke-width="2"/>
  <line x1="450" y1="125" x2="490" y2="160" stroke="#818cf8" stroke-width="2"/>
  <line x1="410" y1="160" x2="390" y2="200" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="410" y1="160" x2="430" y2="200" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="490" y1="160" x2="475" y2="200" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="490" y1="160" x2="510" y2="200" stroke="#6366f1" stroke-width="1.5"/>

  <circle cx="450" cy="125" r="14" fill="#6366f1"/>
  <text x="450" y="129" fill="#fff" font-family="system-ui" font-weight="bold" font-size="10" text-anchor="middle">50</text>
  
  <circle cx="410" cy="160" r="12" fill="#8b5cf6"/>
  <text x="410" y="164" fill="#fff" font-family="system-ui" font-weight="bold" font-size="9" text-anchor="middle">25</text>
  
  <circle cx="490" cy="160" r="12" fill="#8b5cf6"/>
  <text x="490" y="164" fill="#fff" font-family="system-ui" font-weight="bold" font-size="9" text-anchor="middle">75</text>

  <circle cx="390" cy="200" r="10" fill="#a855f7"/>
  <circle cx="430" cy="200" r="10" fill="#a855f7"/>
  <circle cx="475" cy="200" r="10" fill="#a855f7"/>
  <circle cx="510" cy="200" r="10" fill="#a855f7"/>

  <!-- Terminal Output Strip -->
  <rect x="60" y="250" width="480" height="60" rx="6" fill="#050811"/>
  <text x="75" y="272" fill="#34d399" font-family="Courier, monospace" font-size="10">> quicksort(arr, 0, N-1); // Sorted 100,000 elements in 12.8ms</text>
  <text x="75" y="292" fill="#94a3b8" font-family="Courier, monospace" font-size="10">> Memory Allocated: 4.2 MB | Comparisons: 1,642,109 | Status: OK</text>
</svg>

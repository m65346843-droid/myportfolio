<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle with ambient glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradient)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGradient)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>

  <!-- Tech ambient backdrop grid lines -->
  <path d="M 50 200 H 350 M 200 50 V 350" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08"/>
  <circle cx="100" cy="120" r="4" fill="#38bdf8" opacity="0.7"/>
  <circle cx="310" cy="130" r="3" fill="#818cf8" opacity="0.6"/>
  <circle cx="290" cy="280" r="5" fill="#34d399" opacity="0.5"/>

  <!-- Character / Avatar Silhouette -->
  <!-- Shoulders & Hoodie -->
  <path d="M 100 380 C 105 285, 140 255, 200 255 C 260 255, 295 285, 300 380 Z" fill="url(#hoodieGrad)"/>
  
  <!-- Hoodie inner collar / zipper accent -->
  <path d="M 185 260 L 200 310 L 215 260 Z" fill="#1e293b"/>
  <line x1="200" y1="310" x2="200" y2="380" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 182 230 L 218 230 L 214 265 L 186 265 Z" fill="#f59e0b" opacity="0.85"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="180" rx="60" ry="72" fill="url(#skinGrad)"/>

  <!-- Hair / Modern developer hair -->
  <path d="M 135 170 C 135 105, 170 95, 200 95 C 235 95, 268 110, 265 170 C 255 130, 230 115, 200 115 C 165 115, 145 135, 135 170 Z" fill="#1e293b"/>
  <path d="M 140 160 C 150 120, 190 110, 225 118 C 245 123, 260 145, 262 165 C 255 140, 235 125, 205 125 C 170 125, 150 140, 140 160 Z" fill="#0f172a"/>

  <!-- Glasses / Modern sleek frame -->
  <!-- Left lens -->
  <rect x="156" y="162" width="36" height="26" rx="8" fill="#0f172a" fill-opacity="0.15" stroke="#0f172a" stroke-width="4"/>
  <!-- Right lens -->
  <rect x="208" y="162" width="36" height="26" rx="8" fill="#0f172a" fill-opacity="0.15" stroke="#0f172a" stroke-width="4"/>
  <!-- Bridge -->
  <path d="M 192 173 C 196 169, 204 169, 208 173" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <!-- Glass lens reflection highlight -->
  <line x1="162" y1="168" x2="175" y2="168" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="214" y1="168" x2="227" y2="168" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="176" r="3.5" fill="#1e293b"/>
  <circle cx="226" cy="176" r="3.5" fill="#1e293b"/>
  <circle cx="175" cy="174.5" r="1.2" fill="#ffffff"/>
  <circle cx="227" cy="174.5" r="1.2" fill="#ffffff"/>

  <!-- Friendly smile -->
  <path d="M 188 214 Q 200 224 212 214" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Badge: Code Symbol < / > -->
  <g transform="translate(295, 275)" filter="url(#softGlow)">
    <circle cx="24" cy="24" r="24" fill="#6366f1"/>
    <path d="M 17 18 L 12 24 L 17 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 31 18 L 36 24 L 31 30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="16" x2="22" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
